<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #2E3F91; } a:hover { color: #22307A; }
    .w * { box-sizing: border-box; }
  </style>
</helmet>
<div class="w" style="width: 390px; height: 844px; background: #FFFFFF; color: #1A1A1A; display: flex; flex-direction: column;">

  <div style="height: 48px; flex: none;"></div>

  <div style="flex: 1; margin: 0 12px; background: #EDEDEB; border: 1px dashed #B9B9B4; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; position: relative;">
    <span style="font-family: 'Caveat', cursive; font-size: 17px; color: #9B9B97; position: absolute; top: 14px;">live camera</span>
    <div style="width: 250px; height: 120px; border: 2px solid #1A1A1A; border-radius: 4px;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 32px;">
      <span style="font-size: 15px; font-weight: 600;">Point at the barcode</span>
      <span style="font-size: 12.5px; line-height: 1.45; color: #6E6E6B; text-align: center;">Most packs outside Europe and the US are not in any catalogue. If nothing comes back, read the panel instead.</span>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 14px 12px 10px;">
    <div style="flex: 1; height: 44px; border: 1.5px solid #1A1A1A; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; background: #1A1A1A; color: #FFFFFF;">Barcode</div>
    <div style="flex: 1; height: 44px; border: 1.5px solid #D9D9D6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: #6E6E6B;">Ingredient panel</div>
    <div style="width: 44px; height: 44px; border: 1.5px solid #D9D9D6; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"></path><path d="M12 18v3"></path><path d="M5 12H2"></path><path d="M22 12h-3"></path><circle cx="12" cy="12" r="4"></circle></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px 12px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9B9B97" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
    <span style="font-size: 11.5px; color: #9B9B97;">Nothing leaves the phone until you send it</span>
  </div>

  <div style="height: 1px; background: #D9D9D6;"></div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 56px; flex: none;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M21 16v3a2 2 0 0 1-2 2h-3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600;">Scan</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B9B97" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h10"></path></svg>
      <span style="font-size: 10.5px; color: #9B9B97;">Library</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B9B97" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
      <span style="font-size: 10.5px; color: #9B9B97;">You</span>
    </div>
  </div>
  <div style="height: 28px; flex: none;"></div>
</div>
</x-dc>
</body>
</html>
