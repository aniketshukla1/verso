<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #2E3F91; } a:hover { color: #22307A; }
    .w * { box-sizing: border-box; }
  </style>
</helmet>
<div class="w" style="width: 390px; height: 844px; background: #FFFFFF; color: #1A1A1A; display: flex; flex-direction: column;">
  <div style="height: 48px; flex: none;"></div>

  <div style="flex: 1; margin: 0 12px; background: #EDEDEB; border: 1px dashed #B9B9B4; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; position: relative;">
    <span style="font-family: 'Caveat', cursive; font-size: 17px; color: #9B9B97; position: absolute; top: 14px;">live camera</span>
    <div style="width: 300px; height: 330px; border: 2px solid #1A1A1A; border-radius: 4px; display: flex; align-items: flex-end; padding: 10px;">
      <div style="display: flex; flex-direction: column; gap: 5px; width: 100%;">
        <div style="height: 7px; width: 92%; background: #C9C9C4;"></div>
        <div style="height: 7px; width: 88%; background: #C9C9C4;"></div>
        <div style="height: 7px; width: 60%; background: #C9C9C4;"></div>
        <span style="font-family: 'Caveat', cursive; font-size: 15px; color: #6E6E6B; padding-top: 4px;">edges detected &mdash; text is in frame</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 30px;">
      <span style="font-size: 15px; font-weight: 600;">Fill the frame with the ingredient panel</span>
      <span style="font-size: 12.5px; line-height: 1.45; color: #6E6E6B; text-align: center;">Hold steady. Avoid glare on foil and flatten creases.</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 10px;">
    <div style="width: 44px; height: 44px; border: 1.5px solid #D9D9D6; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v3"></path><path d="M12 18v3"></path><path d="M5 12H2"></path><path d="M22 12h-3"></path><circle cx="12" cy="12" r="4"></circle></svg>
    </div>
    <div style="width: 68px; height: 68px; border-radius: 50%; border: 3px solid #1A1A1A; display: flex; align-items: center; justify-content: center;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #1A1A1A;"></div>
    </div>
    <div style="width: 44px; height: 44px; border: 1.5px solid #D9D9D6; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-4 4"></path></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; height: 44px;">
    <span style="font-size: 13px; font-weight: 600; color: #2E3F91;">Back to barcode</span>
  </div>
  <div style="height: 28px; flex: none;"></div>
</div>
</x-dc>
</body>
</html>
