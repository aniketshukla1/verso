services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: verso
      POSTGRES_PASSWORD: verso
      POSTGRES_DB: verso
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verso -d verso"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
